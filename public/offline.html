<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline – AMOS Security</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f5f5f5;
        color: #333;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 320px;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        background: #CC1111;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 40px; height: 40px; fill: white; }
      h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { font-size: 0.9rem; color: #666; margin-bottom: 1.5rem; line-height: 1.5; }
      button {
        background: #CC1111;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #aa0f0f; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4zm7 11.5L2 20.5V7.5l6 3v7zm9 2L9 16V9l8 4v6.5zm7-2l-6 3.5V11l6-3.5v10z"/>
        </svg>
      </div>
      <h1>Tidak ada koneksi</h1>
      <p>Pastikan internet Anda aktif, lalu coba lagi.</p>
      <button onclick="window.location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
